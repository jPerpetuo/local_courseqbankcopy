name: Moodle Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && matrix.dbimage || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mysql:
        image: ${{ matrix.database == 'mysqli' && matrix.dbimage || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Moodle 5.1.1 / PHP 8.4 / MySQL 8.4
            php: '8.4'
            moodle: v5.1.1
            database: mysqli
            dbimage: mysql:8.4
            dbuser: root
            dbport: 3306
            behat: true
          - name: Moodle 5.1 atual / PHP 8.2 / PostgreSQL 15
            php: '8.2'
            moodle: MOODLE_501_STABLE
            database: pgsql
            dbimage: postgres:15
            dbuser: postgres
            dbport: 5432
            behat: false
          - name: Moodle 5.2.1 / PHP 8.4 / MySQL 8.4
            php: '8.4'
            moodle: v5.2.1
            database: mysqli
            dbimage: mysql:8.4
            dbuser: root
            dbport: 3306
            behat: true
          - name: Moodle 5.2 atual / PHP 8.3 / PostgreSQL 16
            php: '8.3'
            moodle: MOODLE_502_STABLE
            database: pgsql
            dbimage: postgres:16
            dbuser: postgres
            dbport: 5432
            behat: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, sodium, intl, mbstring, curl, zip
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          DB_USER: ${{ matrix.dbuser }}
          DB_PASS: ''
          DB_PORT: ${{ matrix.dbport }}
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle code checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin validation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: JavaScript and CSS checks
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat functional test
        if: ${{ !cancelled() && matrix.behat }}
        run: moodle-plugin-ci behat --profile chrome --auto-rerun 0 --dump

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
